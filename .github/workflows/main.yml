name: CI Pipeline
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Build Docker Image
        run: docker build -t my-5g-app .
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Push Image
        run: |
          docker tag my-5g-app ${{ secrets.DOCKER_USERNAME }}/my-5g-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/my-5g-app:latest
      - name: Trigger Jenkins Job
        run: |
          curl -X POST "http://your-jenkins-url/job/deploy/build?token=YOUR_TOKEN"
